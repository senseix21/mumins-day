# Gradle's defaults (512 MiB heap, 384 MiB metaspace) ran out of metaspace in CI once R8 and Android lint both ran
# (GitHub Actions run 46129895522, 2026-11-28). GitHub's Linux runners have 16 GB; 3 GB of heap is plenty.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
